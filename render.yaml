# Render Blueprint: backend web service + managed Postgres.
services:
  - type: web
    name: clinical-trial-eligibility-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: standard            # sentence-transformers + torch need ~1 GB RAM; on a 512 MB plan set EMBEDDINGS_ENABLED=false
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clinical-trial-eligibility-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false           # set to the Vercel URL, e.g. https://your-app.vercel.app
      - key: LLM_PROVIDER
        value: none
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDINGS_ENABLED
        value: "true"
      - key: DATA_DIR
        value: /app/data
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

databases:
  - name: clinical-trial-eligibility-db
    plan: basic-256mb
