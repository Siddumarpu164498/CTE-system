# Render Blueprint: backend web service, frontend static site and managed Postgres, on Render's free plans.
#
# Free web services have 512 MB RAM and no persistent disk, so embeddings are off (the keyword
# retriever is used; agents and page citations are unchanged) and retrieval indexes are rebuilt
# from protocol text stored in Postgres. For FAISS + MiniLM retrieval switch to `plan: standard`,
# set EMBEDDINGS_ENABLED to "true" and add a disk mounted at /app/data.
services:
  - type: web
    name: clinical-trial-eligibility-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clinical-trial-eligibility-db
          property: connectionString
      - key: FRONTEND_ORIGIN    # comma-separated; add a Vercel URL here if you also deploy there
        value: https://clinical-trial-eligibility-app.onrender.com,http://localhost:5173
      - key: LLM_PROVIDER
        value: none
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDINGS_ENABLED
        value: "false"
      - key: DATA_DIR
        value: /app/data

  - type: web
    name: clinical-trial-eligibility-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://clinical-trial-eligibility-api.onrender.com
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: clinical-trial-eligibility-db
    plan: free
